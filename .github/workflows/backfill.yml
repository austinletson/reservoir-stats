name: Backfill package first-seen dates

# Regenerates data/first-seen.json, which records when each package entered the Reservoir
# index. That can only be mined from the index repo's git history, which needs a full
# clone (~640MB, ~80s) — far too heavy for the daily build, and it barely changes.
#
# Run this when the daily build's summary shows the `firstMonth via oldest-version` count
# creeping up: those are packages added since the last backfill, whose first-indexed month
# is being guessed from their oldest retained build instead of measured.
#
# Manual only, and it opens a pull request rather than pushing to main, so the diff gets
# looked at — a bad first-seen.json silently rewrites every growth chart on the site.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why (shown in the PR body)"
        required: false
        default: "Scheduled refresh of package first-seen dates"

permissions:
  contents: write
  pull-requests: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone the Reservoir index with full history
        run: git clone --quiet https://github.com/leanprover/reservoir-index.git "$RUNNER_TEMP/reservoir-index"

      - name: Regenerate data/first-seen.json
        run: |
          python3 first_seen.py --repo "$RUNNER_TEMP/reservoir-index" --out data/first-seen.json 2>&1 | tee backfill.log

      # Prove the new file actually builds a valid summary before proposing it.
      - name: Verify it still produces a valid summary
        run: |
          python3 reservoir_stats.py --refresh --out "$RUNNER_TEMP/summary.json" | tee verify.log

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/first-seen.json; then
            echo "No change to data/first-seen.json." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch="backfill/first-seen-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/first-seen.json
          git commit -m "Refresh package first-seen dates from the index history"
          git push --quiet origin "$branch"

          {
            echo "${{ inputs.reason }}"
            echo
            echo "Regenerated by the \`backfill\` workflow from a full clone of"
            echo "[leanprover/reservoir-index](https://github.com/leanprover/reservoir-index)."
            echo
            echo '### Extraction'
            echo '```'
            cat backfill.log
            echo '```'
            echo
            echo '### The summary this produces'
            echo '```'
            cat verify.log
            echo '```'
            echo
            echo 'Check the `firstMonth via` breakdown: `node-id` and `repo-url` should account'
            echo 'for nearly everything, and `oldest-version` should be small. See docs/DATA.md.'
          } > pr-body.md

          gh pr create --title "Refresh package first-seen dates" --body-file pr-body.md --base "${{ github.ref_name }}" --head "$branch"
          echo "Opened a pull request from \`$branch\`." >> "$GITHUB_STEP_SUMMARY"
